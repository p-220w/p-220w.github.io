<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ PurpleNode | Azezal</title>
    
    <!-- أيقونة الموقع (Favicon) - تظهر في التبويب -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
    
    <style>
        /* إعادة ضبط الصفحة بالكامل لتكون لوحة سوداء نقية */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden; /* يمنع ظهور شريط التمرير المزدوج المزعج */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* حاوية العقدة (Iframe) لتأخذ الشاشة كاملة بدون أي حدود */
        #azezal-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* رسالة ترحيبية أو تحميل تظهر خلف الـ Iframe لو تأخر التحميل */
        #loading-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            text-align: center;
            z-index: -1;
        }
        .star-loader {
            font-size: 50px;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل الوهمية في حال تأخر لابتوبك في الاستجابة -->
    <div id="loading-screen">
        <div class="star-loader">✦</div>
        <p style="font-family: monospace; letter-spacing: 2px;">Establishing Connection to AzezalNode...</p>
    </div>

    <!-- 🚨 السحر هنا: استبدل الرابط أدناه بالرابط الذي نسخته من الـ Terminal 🚨 -->
    <iframe 
        id="azezal-frame" 
        src="https://ffe6cc7b24cee0159c.gradio.live" 
        allow="microphone; camera; autoplay">
    </iframe>

</body>
</html>
